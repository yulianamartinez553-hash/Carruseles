<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 900px; height: 520px;
    background: transparent;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 900px; height: 520px;
  }
  .glow-l {
    position: absolute; left: 120px; top: 180px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217,119,87,.55) 0%, transparent 68%);
    filter: blur(8px);
  }
  .glow-r {
    position: absolute; right: 100px; top: 180px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,211,102,.5) 0%, transparent 68%);
    filter: blur(8px);
  }
  .arc {
    position: absolute; left: 0; top: 0;
    width: 900px; height: 520px;
    pointer-events: none;
  }
  .link-node {
    position: absolute;
    left: 414px; top: 78px;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a, #111);
    border: 2px solid rgba(255,255,255,.85);
    box-shadow:
      0 10px 24px rgba(0,0,0,.55),
      0 0 18px rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .link-node svg { width: 34px; height: 34px; }
  .icon {
    position: absolute;
    width: 240px; height: 240px;
    border-radius: 54px;
    display: flex; align-items: center; justify-content: center;
    z-index: 4;
  }
  .icon.claude {
    left: 110px; top: 170px;
    background:
      linear-gradient(145deg, #F0A080 0%, #D97757 38%, #B85A3D 72%, #8F3F28 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.35),
      inset 0 -10px 18px rgba(0,0,0,.28),
      18px 28px 40px rgba(0,0,0,.55),
      0 0 40px rgba(217,119,87,.35);
    transform: rotate(12deg) perspective(600px) rotateY(-8deg);
  }
  .icon.wa {
    right: 90px; top: 170px;
    background:
      linear-gradient(145deg, #5EEB92 0%, #25D366 40%, #1DA851 70%, #128C3F 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.35),
      inset 0 -10px 18px rgba(0,0,0,.25),
      -18px 28px 40px rgba(0,0,0,.55),
      0 0 40px rgba(37,211,102,.35);
    transform: rotate(-12deg) perspective(600px) rotateY(8deg);
  }
  .icon svg { width: 132px; height: 132px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
  .face-shine {
    position: absolute; inset: 0; border-radius: 54px; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.28) 0%, transparent 42%, transparent 70%, rgba(0,0,0,.12) 100%);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow-l"></div>
  <div class="glow-r"></div>
  <svg class="arc" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
    <path d="M230 250 Q450 40 680 250"
      fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="4"
      stroke-dasharray="3 14" stroke-linecap="round"/>
  </svg>
  <div class="link-node">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
  </div>
  <div class="icon claude">
    <div class="face-shine"></div>
    <!-- Anthropic / Claude starburst mark -->
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#fff" d="M32 8c-2.6 10.2-8.2 17.2-17 21.8C23.8 34.4 29.4 41.4 32 51.6c2.6-10.2 8.2-17.2 17-21.8C40.2 25.2 34.6 18.2 32 8z"/>
      <path fill="#fff" d="M32 18c-1.4 5.6-4.4 9.5-9.2 12.1C27.6 32.7 30.6 36.6 32 42.2c1.4-5.6 4.4-9.5 9.2-12.1C36.4 27.5 33.4 23.6 32 18z" opacity=".95"/>
    </svg>
  </div>
  <div class="icon wa">
    <div class="face-shine"></div>
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#fff" d="M32.1 10.5c-11.7 0-21.2 9.5-21.2 21.2 0 3.7 1 7.3 2.9 10.5L11 53.5l11.7-3.1c3 1.6 6.4 2.5 9.9 2.5h.1c11.7 0 21.2-9.5 21.2-21.2.1-11.7-9.4-21.2-21.8-21.2zm0 38.7h-.1c-3.2 0-6.3-.9-9-2.5l-.6-.4-6.9 1.8 1.8-6.7-.4-.7c-1.8-2.9-2.7-6.2-2.7-9.6 0-9.7 7.9-17.6 17.7-17.6 4.7 0 9.1 1.8 12.5 5.2 3.3 3.3 5.2 7.8 5.1 12.5-.1 9.7-8 17.6-17.4 17.6zm9.7-13.2c-.5-.3-3.1-1.5-3.6-1.7-.5-.2-.8-.3-1.2.3-.3.5-1.3 1.7-1.6 2-.3.4-.6.4-1.1.1-.5-.3-2.2-.8-4.1-2.6-1.5-1.4-2.6-3.1-2.9-3.6-.3-.5 0-.8.2-1.1.2-.2.5-.6.7-.8.2-.3.3-.5.5-.8.2-.3.1-.6 0-.8-.1-.3-1.2-2.8-1.6-3.9-.4-1-.9-0.9-1.2-.9h-1c-.3 0-.9.1-1.3.6-.5.5-1.7 1.7-1.7 4.1s1.8 4.7 2 5c.2.3 3.5 5.4 8.5 7.6 1.2.5 2.1.8 2.8 1.1 1.2.4 2.3.3 3.1.2.9-.1 3.1-1.3 3.5-2.5.4-1.2.4-2.3.3-2.5-.1-.3-.5-.5-1-.8z"/>
    </svg>
  </div>
</div>
</body>
</html>
